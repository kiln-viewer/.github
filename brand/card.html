<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:WIDTHpx;height:HEIGHTpx;background:#120b09;font-family:Jost,sans-serif;color:#eeebe8;display:grid;grid-template-columns:HEIGHTpx 1fr;gap:16px;padding:16px;box-sizing:border-box}
  .icon{background:#1e1411;border-radius:10px;display:grid;place-items:center}
  .icon img{width:78%}
  .main{display:grid;grid-template-rows:1fr auto;gap:16px}
  .name{background:#e6d8c6;color:#1a0e0a;border-radius:10px;display:flex;align-items:center;padding:0 40px;font-weight:700;text-transform:uppercase;letter-spacing:-0.04em;line-height:.9;font-size:NAMEpx;overflow:hidden;white-space:nowrap}
  .row{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  .line{background:#1e1411;border-radius:10px;padding:22px 28px;font-size:LINEpx;font-weight:500;line-height:1.2}
  .url{background:#ff6a2a;color:#1a0e0a;border-radius:10px;padding:22px 28px;font-size:LINEpx;font-weight:700;display:flex;align-items:flex-end}
</style></head><body>
<div class="icon"><img src="icon.png"></div>
<div class="main">
  <div class="name">Kiln viewer</div>
  <div class="row"><div class="line">The Second Life viewer with a studio inside</div><div class="url">kilnviewer.com</div></div>
</div>
</body></html>
